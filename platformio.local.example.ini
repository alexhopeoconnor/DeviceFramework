; Copy to platformio.local.ini.<machine> (ignored) to use sibling worktrees.
; Keep the released platformio.ini portable and do not put credentials here.
; Explicit symlink dependencies deliberately replace the Git tags for this
; checkout. Update the relative paths if your sibling layout differs. Do not
; set lib_dir to a broad parent: PlatformIO would also discover nested test and
; build directories from sibling repositories.
[common]
lib_deps =
    WiFiManager=symlink://../WiFiManager
    DeviceFrameworkTemplateEngine=symlink://../DFTE
    home-assistant-integration=symlink://../arduino-home-assistant
    madpilot/mDNSResolver@^0.3.0
    knolleary/PubSubClient@2.8.0
    ESP32Async/ESPAsyncWebServer@^3.12.0
    bblanchon/ArduinoJson@^7.4.3
