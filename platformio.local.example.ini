; Copy to platformio.local.ini.<machine> (ignored) to use sibling worktrees.
; Keep the released platformio.ini portable and do not put credentials here.
; The separate output tree prevents a local source build from reusing archives
; made for the released dependency graph. It is retained and reused while this
; selector is present; it does not clear or alter PlatformIO's shared cache.
[platformio]
build_dir = .pio/sibling-worktree/build
libdeps_dir = .pio/sibling-worktree/libdeps

; Explicit symlink dependencies replace direct first-party package sources for
; this checkout. Update the relative paths if your sibling layout differs. Do
; not use lib_extra_dirs or a broad lib_dir: both can let the finder combine
; headers from one source tree with an archive from another.
[common]
lib_deps =
    WiFiManager=symlink://../WiFiManager
    DeviceFrameworkTemplateEngine=symlink://../DFTE
    home-assistant-integration=symlink://../arduino-home-assistant
    madpilot/mDNSResolver@^0.3.0
    knolleary/PubSubClient@2.8.0
    ESP32Async/ESPAsyncWebServer@^3.12.0
    bblanchon/ArduinoJson@^7.4.3
