; Copy to platformio.local.ini.<machine> (ignored) to discover sibling worktrees.
; Keep the released platformio.ini portable and do not put credentials here.
[common]
lib_extra_dirs =
    ..
lib_deps =
    madpilot/mDNSResolver@^0.3.0
    knolleary/PubSubClient@2.8.0
    ESP32Async/ESPAsyncWebServer@3.9.1
    bblanchon/ArduinoJson@7.4.2
