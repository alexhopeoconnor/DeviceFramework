[platformio]
default_envs = esp8266
extra_configs = platformio.local.ini.*

[common]
framework = arduino
lib_ldf_mode = deep+
build_flags =
    -DENABLE_WEB_INTERFACE
    -DLOG_LEVEL=3
lib_deps =
    DeviceFramework=symlink://../..

[env:esp8266]
extends = common
platform = espressif8266
board = d1_mini
platform_packages =
    platformio/framework-arduinoespressif8266 @ https://github.com/esp8266/Arduino.git#521ae60a89e64bb0d1eb7a0b7addf620ced5cad3

[env:esp32]
extends = common
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
; This example documents identical USB and OTA firmware identity, so retain
; two application slots instead of huge_app.csv's single USB-only slot.
board_build.partitions = ../../partitions/esp32_ota_4m_no_fs.csv
build_unflags = -std=gnu++11
build_flags =
    ${common.build_flags}
    -std=gnu++14
    -DSOC_WIFI_SUPPORTED=1
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
lib_ignore = ESPAsyncTCP
