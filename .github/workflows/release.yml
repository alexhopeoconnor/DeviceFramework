name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: >-
          bash -n scripts/*.sh tools/lib/platformio.sh tools/lib/ota-fixture-identity.sh tools/check-ota-partitions.sh
          tools/device-ui-hardware tools/ota-hardware tools/lib/device-ui-session.sh
      - run: ./scripts/check-docs.sh
      - run: ./tools/check-ota-partitions.sh
      - run: timeout 15s python3 tests/test-capture-serial.py

  compile-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp8266, esp32]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade platformio==6.2.0
      - run: ./scripts/test.sh compile --platform ${{ matrix.target }}
      - run: ./scripts/test.sh examples --platform ${{ matrix.target }}
      - run: ./scripts/test.sh compile --platform ${{ matrix.target }} --profile-fixture
      - run: ./scripts/test-ota-fixtures.sh --platform ${{ matrix.target }}

  publish:
    needs:
      - documentation
      - compile-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/prepare-release.sh "$GITHUB_REF_NAME"
      - run: ./scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - run: >-
          gh release create "$GITHUB_REF_NAME"
          --title "DeviceFramework $GITHUB_REF_NAME"
          --notes-file "$RUNNER_TEMP/release-notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
