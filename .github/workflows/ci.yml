name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash -n scripts/*.sh
      - run: ./scripts/check-docs.sh

  compile-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp8266, esp32]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade platformio==6.2.0
      - run: ./scripts/test.sh compile --platform ${{ matrix.target }}
      - run: ./scripts/test.sh examples --platform ${{ matrix.target }}
      - run: ./scripts/test.sh compile --platform ${{ matrix.target }} --profile-fixture
