name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: >-
          bash -n scripts/*.sh tools/lib/platformio.sh tools/lib/ota-fixture-identity.sh tools/lib/harness-locks.sh tools/check-ota-partitions.sh
          tools/device-ui-hardware tools/ota-hardware tools/lib/device-ui-session.sh
      - run: python3 -m py_compile test/ota-harness/tools/ota_fixture_input.py
      - run: ./scripts/check-docs.sh
      - run: ./tools/check-ota-partitions.sh
      - run: timeout 15s python3 tests/test-capture-serial.py
      - run: timeout 15s bash tests/test-ota-fixture-identity.sh

  compile-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp8266, esp32]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade platformio==6.2.0
      - run: ./scripts/test.sh compile --platform ${{ matrix.target }}
      - run: ./scripts/test.sh examples --platform ${{ matrix.target }}
      - run: ./scripts/test.sh compile --platform ${{ matrix.target }} --profile-fixture
      # The shared script is deliberately the only board-free A/B fixture
      # builder. It rebuilds one environment from A to B so libdeps are not
      # re-resolved merely to change a test marker.
      - run: ./scripts/test-ota-fixtures.sh --platform ${{ matrix.target }}
