[common]
framework = arduino
; This is a disposable consumer fixture. It deliberately links the checked-out
; DeviceFramework package, while its dependencies resolve from library.json.
lib_ldf_mode = deep+
lib_deps =
    DeviceFramework=symlink://../..
build_flags =
extra_scripts =
    pre:tools/ota_fixture_input.py

; The portal and station/UDP OTA fixtures share these platform bases. Each
; runner builds fixture A, captures it, then rebuilds the same environment as
; fixture B. A generated harness-only header is included only by main.cpp, so
; A/B reuse dependency objects and their one PlatformIO dependency directory
; without changing platform or partition layout.
[env:esp8266_ota_base]
extends = common
platform = espressif8266
board = d1_mini
; OTA must never inherit a board-default layout silently. This exact linker
; script reserves the inactive ESP8266 update region used by Update.begin().
board_build.ldscript = eagle.flash.4m1m.ld
lib_ignore = AsyncTCP
platform_packages =
    platformio/framework-arduinoespressif8266 @ https://github.com/esp8266/Arduino.git#521ae60a89e64bb0d1eb7a0b7addf620ced5cad3
build_flags =
    ${common.build_flags}
    -DENABLE_WEB_INTERFACE
    -DLOG_LEVEL=3
    -DDEVICEFRAMEWORK_HARDWARE_SMOKE

[env:esp32_ota_base]
extends = common
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
; The portal OTA fixture serial-flashes this exact A/B layout before it asks
; WiFiManager's HTTP updater to write B. Never depend on a board default here.
board_build.partitions = ../../partitions/esp32_ota_4m_no_fs.csv
build_unflags = -std=gnu++11
build_flags =
    ${common.build_flags}
    -DENABLE_WEB_INTERFACE
    -DLOG_LEVEL=3
    -DDEVICEFRAMEWORK_HARDWARE_SMOKE
    -std=gnu++14
    -DSOC_WIFI_SUPPORTED=1
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
lib_ignore = ESPAsyncTCP

[env:esp8266_portal_ota]
extends = env:esp8266_ota_base
; The test runner chooses one of the safe, tracked portal profiles. Keeping
; both policies in this environment avoids a second identical libdeps tree.
custom_device_profile = ${sysenv.DEVICEFRAMEWORK_OTA_PROFILE}
build_flags =
    ${env:esp8266_ota_base.build_flags}
    -DDF_PORTAL_OTA_TEST=1
    -DDF_DEFAULT_DEVICE_NAME=\"DF-Portal-ESP8266\"

[env:esp32_portal_ota]
extends = env:esp32_ota_base
; See ESP8266 above: this is one transport environment with two explicit safe
; profile inputs, not two independent dependency resolutions.
custom_device_profile = ${sysenv.DEVICEFRAMEWORK_OTA_PROFILE}
build_flags =
    ${env:esp32_ota_base.build_flags}
    -DDF_PORTAL_OTA_TEST=1
    -DDF_DEFAULT_DEVICE_NAME=\"DF-Portal-ESP32\"

; Station-mode ArduinoOTA uses a profile created by tools/ota-hardware from an
; ignored local Wi-Fi env file. The same environments also accept the tracked
; fake profiles below for CI compilation, so no developer network is baked
; into a committed PlatformIO configuration.
[env:esp8266_udp_ota]
extends = env:esp8266_ota_base
custom_device_profile = ${sysenv.DEVICEFRAMEWORK_OTA_PROFILE}
build_flags =
    ${env:esp8266_ota_base.build_flags}
    -DDF_UDP_OTA_TEST=1
    -DDF_DEFAULT_DEVICE_NAME=\"df-ota-esp8266\"

[env:esp32_udp_ota]
extends = env:esp32_ota_base
custom_device_profile = ${sysenv.DEVICEFRAMEWORK_OTA_PROFILE}
build_flags =
    ${env:esp32_ota_base.build_flags}
    -DDF_UDP_OTA_TEST=1
    -DDF_DEFAULT_DEVICE_NAME=\"df-ota-esp32\"

; This is intentionally ESP8266-only: the product's heap-guard ownership
; behaviour is platform-specific. It raises the existing thresholds before
; setup rather than attempting to manufacture heap fragmentation.
[env:esp8266_udp_ota_deferred]
extends = env:esp8266_udp_ota
build_flags =
    ${env:esp8266_udp_ota.build_flags}
    -DDF_TEST_FORCE_MDNS_DEFERRED=1
