    -DDF_UDP_OTA_TEST=1
    -DDF_DEFAULT_DEVICE_NAME=\"df-ota-esp32\"
    -DDF_OTA_TEST_IMAGE=\"B\"
    -DDF_OTA_TEST_VERSION=\"0.0.0-udp-ota-b\"

; This is intentionally ESP8266-only: the product's heap-guard ownership
; behaviour is platform-specific. It raises the existing thresholds before
; setup rather than attempting to manufacture heap fragmentation.
[env:esp8266_udp_ota_deferred_a]
extends = env:esp8266_udp_ota_a
build_flags =
    ${env:esp8266_udp_ota_a.build_flags}
    -DDF_DEFAULT_DEVICE_NAME=\"df-ota-deferred-esp8266\"
    -DDF_TEST_FORCE_MDNS_DEFERRED=1

[env:esp8266_udp_ota_deferred_b]
extends = env:esp8266_udp_ota_b
build_flags =
    ${env:esp8266_udp_ota_b.build_flags}
    -DDF_DEFAULT_DEVICE_NAME=\"df-ota-deferred-esp8266\"
    -DDF_TEST_FORCE_MDNS_DEFERRED=1
