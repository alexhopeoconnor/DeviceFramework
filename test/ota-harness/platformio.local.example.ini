; Copy to platformio.local.ini.<machine> only when validating the checked-out
; DeviceFramework source. This ignored selector owns a persistent local output
; tree, so it cannot reuse archives built for the released graph. It does not
; clear PlatformIO's shared package cache.
[platformio]
build_dir = .pio/local-source/build

; DeviceFramework is already selected from ../.. by platformio.base.ini. Keep
; its dependencies at the exact released versions in library.json: mixing
; sibling worktrees here makes PlatformIO resolve both a release URL and a
; local substitute. Test a WiFiManager change through WiFiManager's own
; portal harness, then test DeviceFramework against the released WiFiManager
; version it declares after that release is adopted.
