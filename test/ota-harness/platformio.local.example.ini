; Copy to platformio.local.ini.<machine> only when validating unpublished
; sibling worktrees. This ignored selector owns a persistent local output tree,
; so it cannot reuse archives built for the released graph. It does not clear
; PlatformIO's shared package cache.
[platformio]
build_dir = .pio/sibling-worktree/build
libdeps_dir = .pio/sibling-worktree/libdeps

; Do not add lib_extra_dirs or point lib_dir at a broad sibling-worktree
; parent. Either can combine headers from one source tree with an archive from
; another, or scan nested test/build directories as product dependencies.
[common]
lib_deps =
    DeviceFramework=symlink://../..
    WiFiManager=symlink://../../../WiFiManager
    DeviceFrameworkTemplateEngine=symlink://../../../DFTE
    home-assistant-integration=symlink://../../../arduino-home-assistant
    madpilot/mDNSResolver@^0.3.0
    knolleary/PubSubClient@2.8.0
    ESP32Async/ESPAsyncWebServer@^3.12.0
    bblanchon/ArduinoJson@^7.4.3

[env:esp8266_ota_base]
lib_deps =
    ${common.lib_deps}
    ESP32Async/ESPAsyncTCP@2.0.0

[env:esp32_ota_base]
lib_deps =
    ${common.lib_deps}
    ESP32Async/AsyncTCP@^3.5.0
