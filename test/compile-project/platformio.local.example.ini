; Copy to platformio.local.ini.<machine> while validating sibling worktrees
; before their public tags exist. This file is ignored by Git. Explicit
; symlinks select the direct packages. WiFiManager's package root is nested
; under its repository's lib/ directory, so expose that exact storage ahead of
; .pio/libdeps too: this makes the local source win over DeviceFramework's
; tagged transitive dependency. Do not set lib_dir to a broad sibling-worktree
; parent: PlatformIO can discover nested test/build directories that are not
; consumer dependencies.
[common]
lib_extra_dirs =
    ../../../WiFiManager/lib
lib_deps =
    DeviceFramework=symlink://../..
    WiFiManager=symlink://../../../WiFiManager
    DeviceFrameworkTemplateEngine=symlink://../../../DFTE
    home-assistant-integration=symlink://../../../arduino-home-assistant
    madpilot/mDNSResolver@^0.3.0
    knolleary/PubSubClient@2.8.0
    ESP32Async/ESPAsyncWebServer@^3.12.0
    bblanchon/ArduinoJson@^7.4.3

[env:esp8266]
lib_deps =
    ${common.lib_deps}
    ESP32Async/ESPAsyncTCP@2.0.0

[env:esp32]
lib_deps =
    ${common.lib_deps}
    ESP32Async/AsyncTCP@^3.5.0
