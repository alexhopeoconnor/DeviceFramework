; Copy to platformio.local.ini.<machine> while validating sibling worktrees
; before their public tags exist. This file is ignored by Git.
[common]
lib_extra_dirs =
    ../../..
lib_deps =
    madpilot/mDNSResolver@^0.3.0
    knolleary/PubSubClient@2.8.0
    ESP32Async/ESPAsyncWebServer@3.9.1
    bblanchon/ArduinoJson@7.4.2

[env:esp8266]
lib_deps =
    ${common.lib_deps}
    ESP32Async/ESPAsyncTCP@2.0.0

[env:esp32]
lib_deps =
    ${common.lib_deps}
    ESP32Async/AsyncTCP@^3.4.9
