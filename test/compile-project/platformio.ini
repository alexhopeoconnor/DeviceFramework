[platformio]
default_envs = esp8266
extra_configs = platformio.local.ini.*

[common]
framework = arduino
lib_ldf_mode = deep+
lib_deps =
    DeviceFramework=symlink://../..

[env:esp8266]
extends = common
platform = espressif8266
board = d1_mini
platform_packages =
    platformio/framework-arduinoespressif8266 @ https://github.com/esp8266/Arduino.git#521ae60a89e64bb0d1eb7a0b7addf620ced5cad3
build_flags =
    -DENABLE_WEB_INTERFACE
    -DLOG_LEVEL=3

[env:esp8266_default_ui]
extends = env:esp8266
build_flags =
    ${env:esp8266.build_flags}
    -DDEVICEFRAMEWORK_TEST_DEFAULT_UI

[env:esp8266_profile]
extends = env:esp8266
custom_device_profile = ../profiles/profile-fixture.json

[env:esp8266_profile_hardware]
extends = env:esp8266_profile
build_flags =
    ${env:esp8266_profile.build_flags}
    -DDEVICEFRAMEWORK_HARDWARE_SMOKE
custom_device_profile = ${sysenv.DEVICEFRAMEWORK_HARDWARE_PROFILE}

[env:esp8266_no_web]
extends = common
platform = espressif8266
board = d1_mini
platform_packages =
    platformio/framework-arduinoespressif8266 @ https://github.com/esp8266/Arduino.git#521ae60a89e64bb0d1eb7a0b7addf620ced5cad3
build_flags =
    -DLOG_LEVEL=3

[env:esp32]
extends = common
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.05/platform-espressif32.zip
board = esp32dev
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_flags =
    -DENABLE_WEB_INTERFACE
    -DLOG_LEVEL=3
    -std=gnu++14
    -DSOC_WIFI_SUPPORTED=1
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
lib_ignore = ESPAsyncTCP

[env:esp32_default_ui]
extends = env:esp32
build_flags =
    ${env:esp32.build_flags}
    -DDEVICEFRAMEWORK_TEST_DEFAULT_UI

[env:esp32_profile]
extends = env:esp32
custom_device_profile = ../profiles/profile-fixture.json

[env:esp32_profile_hardware]
extends = env:esp32_profile
build_flags =
    ${env:esp32_profile.build_flags}
    -DDEVICEFRAMEWORK_HARDWARE_SMOKE
custom_device_profile = ${sysenv.DEVICEFRAMEWORK_HARDWARE_PROFILE}
