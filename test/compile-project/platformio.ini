[platformio]
default_envs = esp8266

[common]
framework = arduino
lib_ldf_mode = deep+
lib_deps =
    DeviceFramework=symlink://../..

[env:esp8266]
extends = common
platform = espressif8266
board = d1_mini
platform_packages =
    platformio/framework-arduinoespressif8266 @ https://github.com/esp8266/Arduino.git#521ae60a89e64bb0d1eb7a0b7addf620ced5cad3
build_flags =
    -DENABLE_WEB_INTERFACE
    -DLOG_LEVEL=3

[env:esp8266_profile]
extends = env:esp8266
custom_device_profile = ../profiles/profile-fixture.json

[env:esp8266_no_web]
extends = common
platform = espressif8266
board = d1_mini
platform_packages =
    platformio/framework-arduinoespressif8266 @ https://github.com/esp8266/Arduino.git#521ae60a89e64bb0d1eb7a0b7addf620ced5cad3
build_flags =
    -DLOG_LEVEL=3

[env:esp32]
extends = common
platform = espressif32@6.13.0
board = esp32dev
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_flags =
    -DENABLE_WEB_INTERFACE
    -DLOG_LEVEL=3
    -std=gnu++14

[env:esp32_profile]
extends = env:esp32
custom_device_profile = ../profiles/profile-fixture.json
