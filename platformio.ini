[platformio]
default_envs = esp8266
; A developer may create an ignored platformio.local.ini.<machine> override.
extra_configs = platformio.local.ini.*

[common]
framework = arduino
test_framework = unity
test_build_src = yes
; Root-project tests need the same library-owned profile hook that consumers
; receive through library.json.
extra_scripts = pre:tools/platformio/profile.py
; Framework WiFi uses conditional internal translation units on ESP32.
; Deep scanning retains those units when the test firmware links the library.
lib_ldf_mode = deep+
monitor_speed = 115200
test_speed = 115200
build_flags =
    -DENABLE_WEB_INTERFACE
    -DLOG_LEVEL=3
lib_deps =
    WiFiManager=https://github.com/alexhopeoconnor/WiFiManager.git#v3.2.2
    DeviceFrameworkTemplateEngine=https://github.com/alexhopeoconnor/DFTE.git#v1.2.0
    home-assistant-integration=https://github.com/alexhopeoconnor/arduino-home-assistant.git#v3.1.0
    madpilot/mDNSResolver@^0.3.0
    knolleary/PubSubClient@2.8.0
    ESP32Async/ESPAsyncWebServer@^3.12.0
    bblanchon/ArduinoJson@^7.4.3

[env:esp8266]
extends = common
platform = espressif8266
board = d1_mini
; Pinned upstream workaround for dangerous relocation linker failures.
platform_packages =
    platformio/framework-arduinoespressif8266 @ https://github.com/esp8266/Arduino.git#521ae60a89e64bb0d1eb7a0b7addf620ced5cad3
lib_ignore = AsyncTCP
lib_deps =
    ${common.lib_deps}
    ESP32Async/ESPAsyncTCP@2.0.0

[env:esp8266_profile]
extends = env:esp8266
build_flags =
    ${env:esp8266.build_flags}
    -DDF_DEFAULT_DEVICE_NAME=\"df-test-esp8266\"
custom_device_profile = test/profiles/profile-fixture.json

[env:esp8266_profile_reconcile]
extends = env:esp8266
build_flags =
    ${env:esp8266.build_flags}
    -DDF_DEFAULT_DEVICE_NAME=\"df-test-esp8266\"
custom_device_profile = test/profiles/profile-reconcile-fixture.json

[env:esp8266_profile_hardware]
extends = env:esp8266
build_flags =
    ${env:esp8266.build_flags}
    -DDF_DEFAULT_DEVICE_NAME=\"df-test-esp8266\"
custom_device_profile = ${sysenv.DEVICEFRAMEWORK_HARDWARE_PROFILE}

[env:esp32]
extends = common
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_flags =
    ${common.build_flags}
    -std=gnu++14
    -DSOC_WIFI_SUPPORTED=1
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
lib_ignore = ESPAsyncTCP
lib_deps =
    ${common.lib_deps}
    ESP32Async/AsyncTCP@^3.5.0

[env:esp32_profile]
extends = env:esp32
build_flags =
    ${env:esp32.build_flags}
    -DDF_DEFAULT_DEVICE_NAME=\"df-test-esp32\"
custom_device_profile = test/profiles/profile-fixture.json

[env:esp32_profile_reconcile]
extends = env:esp32
build_flags =
    ${env:esp32.build_flags}
    -DDF_DEFAULT_DEVICE_NAME=\"df-test-esp32\"
custom_device_profile = test/profiles/profile-reconcile-fixture.json

[env:esp32_profile_hardware]
extends = env:esp32
build_flags =
    ${env:esp32.build_flags}
    -DDF_DEFAULT_DEVICE_NAME=\"df-test-esp32\"
custom_device_profile = ${sysenv.DEVICEFRAMEWORK_HARDWARE_PROFILE}

[env:esp8266_no_web]
extends = common
platform = espressif8266
board = d1_mini
; This environment proves the optional-web-free build. Do not compile the
; web-dependent integration suite when callers omit an explicit --filter.
test_filter = test_compile_no_web
; Compile the optional-web-free configuration so logging remains link-safe.
build_flags =
    -DLOG_LEVEL=3
lib_ignore = AsyncTCP
lib_deps =
    ${common.lib_deps}
    ESP32Async/ESPAsyncTCP@2.0.0

[env:esp8266_ha_e2e]
extends = env:esp8266_no_web
test_filter = test_ha_e2e
build_flags =
    ${env:esp8266_no_web.build_flags}
    -DDEVICEFRAMEWORK_HA_E2E=1

[env:esp32_ha_e2e]
extends = env:esp32
test_filter = test_ha_e2e
; `test_build_src` already compiles this project's src/. Deep LDF can also
; discover the project library through ESP32-only WiFi dependencies, yielding
; duplicate translation units at link time.
lib_ignore =
    ${env:esp32.lib_ignore}
    DeviceFramework
build_unflags =
    -std=gnu++11
    -DENABLE_WEB_INTERFACE
build_flags =
    ${env:esp32.build_flags}
    -DDEVICEFRAMEWORK_HA_E2E=1
