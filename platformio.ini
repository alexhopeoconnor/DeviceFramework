[platformio]
default_envs = esp8266
; A developer may create an ignored platformio.local.ini.<machine> override.
extra_configs = platformio.local.ini.*

[common]
framework = arduino
test_framework = unity
test_build_src = yes
; Framework WiFi uses conditional internal translation units on ESP32.
; Deep scanning retains those units when the test firmware links the library.
lib_ldf_mode = deep+
monitor_speed = 115200
build_flags =
    -DENABLE_WEB_INTERFACE
    -DLOG_LEVEL=3
lib_deps =
    WiFiManager=https://github.com/alexhopeoconnor/WiFiManager.git#v3.0.2
    DeviceFrameworkTemplateEngine=https://github.com/alexhopeoconnor/DFTE.git#v1.0.2
    home-assistant-integration=https://github.com/alexhopeoconnor/arduino-home-assistant.git#v3.0.0
    madpilot/mDNSResolver@^0.3.0
    knolleary/PubSubClient@2.8.0
    ESP32Async/ESPAsyncWebServer@3.9.1
    bblanchon/ArduinoJson@7.4.2

[env:esp8266]
extends = common
platform = espressif8266
board = d1_mini
; Pinned upstream workaround for dangerous relocation linker failures.
platform_packages =
    platformio/framework-arduinoespressif8266 @ https://github.com/esp8266/Arduino.git#521ae60a89e64bb0d1eb7a0b7addf620ced5cad3
lib_ignore = AsyncTCP

[env:esp32]
extends = common
platform = espressif32@6.13.0
board = esp32dev
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_flags =
    ${common.build_flags}
    -std=gnu++14

[env:esp8266_no_web]
extends = common
platform = espressif8266
board = d1_mini
; Compile the optional-web-free configuration so logging remains link-safe.
build_flags =
    -DLOG_LEVEL=3
lib_ignore = AsyncTCP
