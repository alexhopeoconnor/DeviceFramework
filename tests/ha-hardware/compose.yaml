services:
  mqtt:
    image: eclipse-mosquitto:2
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "${MQTT_BIND_IP:-127.0.0.1}:1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/version' -C 1 -W 5 >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 20

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:${HA_VERSION:-stable}
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:${HA_PORT:-8125}:8123"
    volumes:
      - ha_config:/config
    depends_on:
      mqtt:
        condition: service_healthy

  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        ha_testkit: ${AHA_TESTKIT_PATH:?Set AHA_TESTKIT_PATH to ha-mqtt-contract}
    command: ["python", "bootstrap.py"]
    environment:
      HA_URL: http://homeassistant:8123
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
    volumes:
      - test_state:/state
    depends_on:
      mqtt:
        condition: service_healthy
      homeassistant:
        condition: service_started

  verifier:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        ha_testkit: ${AHA_TESTKIT_PATH:?Set AHA_TESTKIT_PATH to ha-mqtt-contract}
    environment:
      HA_URL: http://homeassistant:8123
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      E2E_MODE: ${E2E_MODE:-fixture}
      E2E_EXPECTED_DEVICE_ID: ${E2E_EXPECTED_DEVICE_ID:-}
      VERIFY_CAPTURED_FIXTURE: ${VERIFY_CAPTURED_FIXTURE:-0}
    volumes:
      - test_state:/state
      - ${ARTIFACT_DIR:-./artifacts}:/artifacts
    depends_on:
      mqtt:
        condition: service_healthy
      homeassistant:
        condition: service_started

volumes:
  ha_config:
  test_state:
